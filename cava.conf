# Configuración de cava SOLO para el widget mpris-pill.
# No toca tu configuración normal de cava (~/.config/cava/config).

[general]
# Cantidad de barras. Debe coincidir con `barCount` en shell.qml
bars = 16
framerate = 60

[input]
# "pulse" funciona sobre PipeWire a través de pipewire-pulse
# (tu `pactl info` indica: PulseAudio on PipeWire)
method = pulse
source = auto

[output]
# En vez de dibujar en una terminal, cava escribe los números por stdout
method = raw
raw_target = /dev/stdout
data_format = ascii
# Cada barra va de 0 a 100
ascii_max_range = 100
# 59 = ";" separa barras, 10 = salto de línea separa fotogramas
bar_delimiter = 59
frame_delimiter = 10
# Un solo canal: las barras van de graves (izquierda) a agudos (derecha)
channels = mono
